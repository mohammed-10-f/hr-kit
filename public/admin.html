<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HR Kit — الإدارة</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">HR</span><span><strong>HR Kit</strong><small>لوحة الإدارة</small></span></a>
  <a class="admin-link" href="/">الموقع</a>
</header>
<main class="admin-main">
  <section class="admin-card">
    <div class="section-head"><div><h2>إضافة مورد جديد</h2><p>أضف النموذج أو الملف وسيظهر للزوار بعد النشر.</p></div></div>
    <form id="resource-form" class="form-grid">
      <label>اسم المورد<input name="title" required placeholder="مثال: نموذج إخلاء طرف موظف"></label>
      <label>التصنيف<select name="category_id" id="category"></select></label>
      <label class="full">الوصف<textarea name="description" placeholder="وصف مختصر يساعد الباحث على معرفة محتوى الملف"></textarea></label>
      <label>الكلمات المفتاحية<input name="keywords" placeholder="إخلاء طرف، مخالصة، إنهاء خدمة"></label>
      <label>الإصدار<input name="version" value="1.0"></label>
      <label class="full">رابط الملف<input name="file_url" required type="url" placeholder="https://..."></label>
      <button class="primary full" type="submit">نشر المورد</button>
    </form>
    <div id="message"></div>
  </section>
</main>
<script>const token=prompt("أدخل كلمة مرور الإدارة:");const headers={Authorization:"Bearer "+(token||""),"Content-Type":"application/json"};async function loadCats(){const cats=await fetch("/api/categories").then(r=>r.json());category.innerHTML=cats.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join("")}loadCats();document.querySelector("#resource-form").addEventListener("submit",async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());message.textContent="جاري الحفظ...";const d=await fetch("/api/admin/resources",{method:"POST",headers,body:JSON.stringify(body)}).then(r=>r.json());message.textContent=d.ok?"تم نشر المورد بنجاح.":(d.error||"تعذر الحفظ");if(d.ok)e.target.reset()});</script>
</body>
</html>
