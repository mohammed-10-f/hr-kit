<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HR Kit — الإدارة</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">HR</span><span><strong>HR Kit</strong><small>لوحة الإدارة</small></span></a>
  <a class="admin-link" href="/">الموقع</a>
</header>
<main class="admin-main">
  <section class="admin-card">
    <div class="section-head"><div><h2>إضافة مورد جديد</h2><p>أضف النموذج أو الملف وسيظهر للزوار بعد النشر.</p></div></div>
    <form id="resource-form" class="form-grid">
      <label>اسم المورد<input name="title" required placeholder="مثال: نموذج إخلاء طرف موظف"></label>
      <label>التصنيف<select name="category_id" id="category"></select></label>
      <label class="full">الوصف<textarea name="description" placeholder="وصف مختصر يساعد الباحث على معرفة محتوى الملف"></textarea></label>
      <label>الكلمات المفتاحية<input name="keywords" placeholder="إخلاء طرف، مخالصة، إنهاء خدمة"></label>
      <label>الإصدار<input name="version" value="1.0"></label>
      <label class="full">الملف<input type="file" name="file" required accept=".doc,.docx,.xls,.xlsx,.pdf,.ppt,.pptx,.zip"></label>
      <button class="primary full" type="submit">نشر المورد</button>
    </form>
    <div id="message"></div>
  </section>
</main>
<script>
const token = prompt("أدخل كلمة مرور الإدارة:");
const headers = { Authorization: "Bearer " + (token || "") };
async function loadCats(){
  const cats = await fetch("/api/categories").then(r=>r.json());
  category.innerHTML = cats.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join("");
}
loadCats();
document.querySelector("#resource-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const form = new FormData(e.target);
  const file = form.get("file");
  message.textContent = "جاري رفع الملف...";
  const upload = new FormData(); upload.append("file", file);
  const up = await fetch("/api/admin/upload",{method:"POST",headers,body:upload}).then(r=>r.json());
  if(!up.ok){ message.textContent = up.error || "تعذر رفع الملف"; return; }
  const body = Object.fromEntries(form.entries());
  body.file_key = up.key; body.file_name = up.file_name; body.file_type = up.file_type; body.file_size = up.file_size;
  const saved = await fetch("/api/admin/resources",{method:"POST",headers:{"Authorization":headers.Authorization,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
  message.textContent = saved.ok ? "تم نشر المورد بنجاح." : (saved.error || "تعذر حفظ المورد");
  if(saved.ok) e.target.reset();
});
</script>
</body>
</html>
