<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b63"><title>تعبئة النموذج — HR Reference</title>
<link rel="icon" type="image/png" href="/assets/logo.png"><link rel="stylesheet" href="/form-builder.css">
</head>
<body class="fb-body fill-body">
<header class="fb-topbar">
  <div class="fb-brand"><a href="/">HR Reference</a><span id="form-title">تعبئة النموذج</span></div>
  <div class="fb-top-actions"><button id="reset-btn" class="fb-btn ghost">إعادة تعيين</button><button id="generate-btn" class="fb-btn primary">إنشاء النموذج</button></div>
</header>
<main class="fill-shell">
  <section class="fill-main">
    <div class="fill-heading"><div><small>LIVE FORM FILLING</small><h1 id="heading">جاري التحميل…</h1><p>اكتب داخل الحقول وشاهد البيانات تظهر مباشرة في النموذج.</p></div><span id="draft-state" class="save-state">يحفظ محليًا</span></div>
    <div id="fill-workspace" class="pdf-workspace"><div class="loading-state">جاري تحميل الـPDF…</div></div>
  </section>
  <aside class="fill-side"><div class="side-card"><div class="side-title">حقول النموذج</div><div id="field-summary" class="field-summary"></div><div class="side-note">يمكنك التنقل بين الحقول باستخدام Tab. البيانات تحفظ كمسودة على هذا الجهاز.</div></div></aside>
</main>
<div id="toast" class="fb-toast"></div>
<script>
(function(){
  const PDFJS_SOURCES=[
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
  ];
  const PDFJS_WORKERS=[
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
  ];
  const PDFLIB_SOURCES=[
    'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',
    'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'
  ];
  const workspaceId = location.pathname.includes('form-designer') ? 'pdf-workspace' : 'fill-workspace';
  const show=(msg,detail='')=>{
    const el=document.getElementById(workspaceId);
    if(el) el.innerHTML='<div class="loading-state">'+msg+(detail?'<br><small>'+detail+'</small>':'')+'</div>';
  };
  const loadScript=(urls,label,timeout=9000)=>new Promise((resolve,reject)=>{
    let i=0, last='';
    const next=()=>{
      if(i>=urls.length){reject(new Error('تعذر تحميل '+label+' من مصادر الإنترنت.'));return;}
      const url=urls[i++], s=document.createElement('script'), timer=setTimeout(()=>{s.remove();last='timeout';next()},timeout);
      s.async=false;
      s.onload=()=>{clearTimeout(timer);resolve(url)};
      s.onerror=()=>{clearTimeout(timer);last='error';s.remove();next()};
      s.src=url; document.head.appendChild(s);
    };
    next();
  });
  async function boot(){
    try{
      show('تهيئة محرك PDF…','يتم تحميل محرك عرض PDF');
      const pdfjsUrl=await loadScript(PDFJS_SOURCES,'محرك PDF');
      if(!window.pdfjsLib) throw new Error('تم تحميل المصدر لكن محرك PDF غير متاح');
      const workerIndex=Math.max(0,PDFJS_SOURCES.indexOf(pdfjsUrl));
      pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKERS[workerIndex]||PDFJS_WORKERS[0];
      if(location.pathname.includes('form-fill')){
        show('تهيئة محرك إنشاء PDF…','يتم تحميل مكتبة إنشاء الملف النهائي');
        await loadScript(PDFLIB_SOURCES,'مكتبة إنشاء PDF');
        if(!window.PDFLib) throw new Error('مكتبة إنشاء PDF غير متاحة');
        const s=document.createElement('script');s.src='/form-filler.js';s.onload=()=>{};s.onerror=()=>show('تعذر تشغيل نموذج التعبئة','تحقق من نشر ملف form-filler.js ثم أعد المحاولة.');document.body.appendChild(s);
      }else{
        const s=document.createElement('script');s.src='/form-designer.js';s.onload=()=>{};s.onerror=()=>show('تعذر تشغيل مصمم النماذج','تحقق من نشر ملف form-designer.js ثم أعد المحاولة.');document.body.appendChild(s);
      }
    }catch(e){
      show('تعذر تشغيل محرك PDF',e.message+' إذا استمرت المشكلة بعد إعادة المحاولة فالمشكلة في اتصال المتصفح بمصادر مكتبات PDF.');
      console.error(e);
    }
  }
  boot();
})();
</script>
</body>
</html>
